<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="preconnect" href="https://rsms.me">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="shortcut icon" href="../burger-icon.svg" type="image/x-icon">    
    <link rel="stylesheet" href="../assets/css/style.css">

</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg container">

            <div class="container-fluid col-2 col-md-2 col-lg-5">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll"
                    aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarScroll">
                    <ul class="navbar-nav me-auto my-2 my-lg-0 ">
                        <li class="nav-item"><a href="../Index.html">Accueil</a></li>
                        <li class="nav-item"><a href="Recipe.html">Recette</a></li>
                        <li class="nav-item"><a href="Search.html">Recherche</a></li>
                        <li class="nav-item"><a href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>

            <div class="banner-right col-10 col-md-10 col-lg-7">
                <div class="search-wrapper" id="searchWrapper">
                    <div class="search-box">

                        <button class="search-btn" id="searchBtn" aria-label="Déplier la barre de recherche">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>

                        <input type="text" class="search-input" id="searchInput" placeholder="Rechercher..." aria-label="rechercher une recette"/>

                    </div>
                </div>


                <a class="d-none d-md-block active" href="SignIn.html">Sign In</a>

                <a class="btn-cta" href="SignIn.html" role="button">Sign Up</a>
            </div>

        </nav>


    </header>


    <main class="container-signIn container">
        <div class="row">
        <section class="col-12 col-md-12 col-lg-6">
            <form action="" method="" class="form-signin">
                <div class="connect">
                    <h1>Connectez-vous!</h1>

                    <button type="button"><i class="fa-brands fa-square-facebook" id="fb"></i></button>
                    <button type="button"><i class="fa-brands fa-square-google-plus" id="google"></i></button>
                    <button type="button"><i class="fa-brands fa-square-linkedin" id="linkedIn"></i></button>

                    <p>Ou utilisez vos identifiants</p>
                </div>

                <fieldset>
                    <div>
                        <label for="email">E-mail :</label>
                        <input type="email" id="email" placeholder="Exemple@gmail.com" required>
                    </div>
                    <div>
                        <label for="pwd">Mot de passe :</label>
                        <input type="password" name="password" id="pwd" placeholder="Mot de passe" required>
                    </div>
                </fieldset>

                <a href="">Mot de passe oublié?</a> <br>

                <button type="submit" id="call-back-btn">Connexion</button>
            </form>
        </section>

        <section class="redir-signup col-12 col-md-12 col-lg-6">

            <h2>Salut, rejoignez-nous</h2>

            <p>Entrez vos informations et rejoignez la communauté de cuisiniers</p>

            <button class="btn" type="button">Inscrivez-vous</button>

        </section>
</div>
    </main>

    <footer>

    </footer>

    <script src="../assets/js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
